# Contenido copiado literalmente de config/wazuh/dashboard/opensearch_dashboards.yml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: irlab-dashboard-opensearch-config
  namespace: irlab
  labels:
    app: wazuh-dashboard
    app.kubernetes.io/part-of: incident-response-lab
data:
  opensearch_dashboards.yml: |
    server.host: 0.0.0.0
    server.port: 5601
    opensearch.hosts: https://wazuh-indexer:9200
    opensearch.ssl.verificationMode: certificate
    opensearch.username: kibanaserver
    opensearch.password: LabIrlabKibana2026+
    opensearch.requestHeadersAllowlist: ["securitytenant", "Authorization"]
    server.ssl.enabled: true
    server.ssl.key: "/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem"
    server.ssl.certificate: "/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem"
    opensearch.ssl.certificateAuthorities: ["/usr/share/wazuh-dashboard/certs/root-ca.pem"]
    uiSettings.overrides.defaultRoute: /app/wz-home
    opensearchDashboards.defaultAppId: "wz-home"

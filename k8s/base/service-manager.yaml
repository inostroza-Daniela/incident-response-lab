apiVersion: v1
kind: Service
metadata:
  name: wazuh-manager
  namespace: irlab
  labels:
    app: wazuh-manager
    app.kubernetes.io/part-of: incident-response-lab
spec:
  type: ClusterIP
  selector:
    app: wazuh-manager
  ports:
    - name: agents
      protocol: TCP
      port: 1514
      targetPort: 1514
    - name: api
      protocol: TCP
      port: 55000
      targetPort: 55000

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: irlab
resources:
  - namespace.yaml
  - networkpolicy.yaml
  - configmap-indexer.yml
  - configmap-internal-users.yml
  - configmap-dashboard-opensearch.yml
  - configmap-dashboard-wazuh.yml
  - configmap-agent-ossec.yml
  - configmap-auditd-rules.yml
  - pvc-indexer.yaml
  - pvc-manager.yaml
  - pvc-telemetria.yaml
  - pvc-alertas.yaml
  - deployment-indexer.yaml
  - deployment-manager.yaml
  - deployment-dashboard.yaml
  - job-init-telemetria.yaml
  - deployment-nodo-monitoreado.yaml
  - deployment-operador.yaml
  - service-indexer.yaml
  - service-manager.yaml
  - service-dashboard.yaml
secretGenerator:
  - name: irlab-certs
    files:
      - secrets/config/wazuh/certs/root-ca.pem
      - secrets/config/wazuh/certs/wazuh.indexer.pem
      - secrets/config/wazuh/certs/wazuh.manager.pem
      - secrets/config/wazuh/certs/wazuh.dashboard.pem
      - secrets/config/wazuh/certs/admin.pem
      - secrets/config/wazuh/certs/root-ca.key
      - secrets/config/wazuh/certs/wazuh.indexer-key.pem
      - secrets/config/wazuh/certs/wazuh.manager-key.pem
      - secrets/config/wazuh/certs/wazuh.dashboard-key.pem
      - secrets/config/wazuh/certs/admin-key.pem
    options:
      disableNameSuffixHash: true
  - name: irlab-credentials
    envs:
      - secrets/.env
    options:
      disableNameSuffixHash: true

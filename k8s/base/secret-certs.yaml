# Certificados internos generados por scripts/generar-certs.sh.
# Contenido real de config/wazuh/certs/* codificado en base64 (no placeholders).
# Uso exclusivo en laboratorio aislado; regenerar este Secret si se regeneran los certs.
apiVersion: v1
kind: Secret
metadata:
  name: irlab-certs
  namespace: irlab
  labels:
    app.kubernetes.io/part-of: incident-response-lab
type: Opaque
data:
  root-ca.pem: 
  root-ca.key: 
  wazuh.indexer.pem: 
  wazuh.indexer-key.pem: 
  wazuh.manager.pem: 
  wazuh.manager-key.pem: 
  wazuh.dashboard.pem: 
  wazuh.dashboard-key.pem: 
  admin.pem: 
  admin-key.pem: 

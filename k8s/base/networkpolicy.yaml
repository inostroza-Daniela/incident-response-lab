# Red del laboratorio: semantics "internal only" (equivalente a `internal: true`
# en docker-compose). Todo el tráfico se niega por defecto y solo se permite lo
# necesario entre los pods del namespace irlab, más DNS hacia kube-system.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: irlab
  labels:
    app.kubernetes.io/part-of: incident-response-lab
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# indexer <- manager:9200, dashboard:9200. Sin egress propio (las consultas
# salen respondiendo a las conexiones entrantes); DNS se permite globalmente.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wazuh-indexer-network
  namespace: irlab
  labels:
    app.kubernetes.io/part-of: incident-response-lab
spec:
  podSelector:
    matchLabels:
      app: wazuh-indexer
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: irlab
          podSelector:
            matchLabels:
              app: wazuh-manager
      ports:
        - protocol: TCP
          port: 9200
    - from:
        - namespaceSelector:
            matchLabels:
              name: irlab
          podSelector:
            matchLabels:
              app: wazuh-dashboard
      ports:
        - protocol: TCP
          port: 9200
  egress: []
---
# manager <- nodo-monitoreado:1514, dashboard:55000, operador:55000.
# manager -> indexer:9200 para indexar alertas.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wazuh-manager-network
  namespace: irlab
  labels:
    app.kubernetes.io/part-of: incident-response-lab
spec:
  podSelector:
    matchLabels:
      app: wazuh-manager
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: irlab
          podSelector:
            matchLabels:
              app: nodo-monitoreado
      ports:
        - protocol: TCP
          port: 1514
    - from:
        - namespaceSelector:
            matchLabels:
              name: irlab
          podSelector:
            matchLabels:
              app: wazuh-dashboard
      ports:
        - protocol: TCP
          port: 55000
    - from:
        - namespaceSelector:
            matchLabels:
              name: irlab
          podSelector:
            matchLabels:
              app: operador
      ports:
        - protocol: TCP
          port: 55000
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: irlab
          podSelector:
            matchLabels:
              app: wazuh-indexer
      ports:
        - protocol: TCP
          port: 9200
---
# dashboard: solo tráfico interno del laboratorio en base (sin Ingress ni
# NodePort; en Compose el puerto estaba atado a 127.0.0.1).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wazuh-dashboard-network
  namespace: irlab
  labels:
    app.kubernetes.io/part-of: incident-response-lab
spec:
  podSelector:
    matchLabels:
      app: wazuh-dashboard
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              name: irlab
      ports:
        - protocol: TCP
          port: 5601
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: irlab
          podSelector:
            matchLabels:
              app: wazuh-indexer
      ports:
        - protocol: TCP
          port: 9200
    - to:
        - namespaceSelector:
            matchLabels:
              name: irlab
          podSelector:
            matchLabels:
              app: wazuh-manager
      ports:
        - protocol: TCP
          port: 55000
---
# nodo-monitoreado -> manager:1514 (agente Wazuh). No acepta conexiones.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nodo-monitoreado-network
  namespace: irlab
  labels:
    app.kubernetes.io/part-of: incident-response-lab
spec:
  podSelector:
    matchLabels:
      app: nodo-monitoreado
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: irlab
          podSelector:
            matchLabels:
              app: wazuh-manager
      ports:
        - protocol: TCP
          port: 1514
---
# operador -> manager:55000 (verificación de alertas). No acepta conexiones.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: operador-network
  namespace: irlab
  labels:
    app.kubernetes.io/part-of: incident-response-lab
spec:
  podSelector:
    matchLabels:
      app: operador
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              name: irlab
          podSelector:
            matchLabels:
              app: wazuh-manager
      ports:
        - protocol: TCP
          port: 55000
---
# DNS al cluster: único egress permitido fuera del namespace irlab.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-kube-system
  namespace: irlab
  labels:
    app.kubernetes.io/part-of: incident-response-lab
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

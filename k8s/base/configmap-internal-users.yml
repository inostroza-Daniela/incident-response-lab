# Contenido copiado literalmente de config/wazuh/indexer/internal_users.yml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: irlab-internal-users
  namespace: irlab
  labels:
    app: wazuh-indexer
    app.kubernetes.io/part-of: incident-response-lab
data:
  internal_users.yml: |
    ---
    # Usuarios internos del indexer. Credenciales SOLO de laboratorio.
    # Los hashes corresponden a las contraseñas por defecto del .env.example; si las
    # cambiás en .env, regenerá el hash con `make hash-pass` y reemplazalo aquí.
    _meta:
      type: "internalusers"
      config_version: 2

    admin:
      hash: "$2b$12$EL2N8J4TSPzxsZ9dD9tksOTXdDEQtY3RBLg.tMGXfka.TG4fdNjPq"
      reserved: true
      backend_roles:
        - "admin"
      description: "Administrador del indexer (laboratorio)"

    kibanaserver:
      hash: "$2b$12$Ul6R04DXgsSwcQLyDyXiLOoaa/iiUpa3ZSkDpBiMVkwnNu0HgT8YO"
      reserved: true
      description: "Usuario del dashboard (laboratorio)"

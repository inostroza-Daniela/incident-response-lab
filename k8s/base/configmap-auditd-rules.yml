# Contenido copiado literalmente de config/auditd/irlab.rules.
# Ilustrativo en contenedores: auditd requiere el subsistema de auditoría del host.
apiVersion: v1
kind: ConfigMap
metadata:
  name: irlab-auditd-rules
  namespace: irlab
  labels:
    app: nodo-monitoreado
    app.kubernetes.io/part-of: incident-response-lab
data:
  irlab.rules: |
    ## Política de auditd que alimenta las reglas que despliega el laboratorio de respuesta a incidentes.
    ## Copiar a /etc/audit/rules.d/irlab.rules y recargar con `augenrules --load`.
    ## Las llaves (-k) son informativas: las reglas Sigma no dependen de ellas.

    -D
    -b 8192
    -f 1

    ## Ejecución de procesos (webshell, reverse_shell, descarga_y_ejecucion, cuentas, historial)
    -a always,exit -F arch=b64 -S execve -k exec
    -a always,exit -F arch=b32 -S execve -k exec

    ## Archivos de cuentas (modificacion_passwd_shadow, cuenta_local_creada_o_agregada_a_sudo)
    -w /etc/passwd -p wa -k identidad
    -w /etc/shadow -p rwa -k identidad
    -w /etc/gshadow -p rwa -k identidad
    -w /etc/group -p wa -k identidad
    -w /etc/sudoers -p wa -k sudoers
    -w /etc/sudoers.d/ -p wa -k sudoers

    ## Persistencia (persistencia_cron, persistencia_systemd)
    -w /etc/crontab -p wa -k cron
    -w /etc/cron.d/ -p wa -k cron
    -w /etc/cron.hourly/ -p wa -k cron
    -w /etc/cron.daily/ -p wa -k cron
    -w /etc/cron.weekly/ -p wa -k cron
    -w /etc/cron.monthly/ -p wa -k cron
    -w /var/spool/cron/ -p wa -k cron
    -w /etc/systemd/system/ -p wa -k systemd
    -w /usr/lib/systemd/system/ -p wa -k systemd
    -w /lib/systemd/system/ -p wa -k systemd
    -w /run/systemd/system/ -p wa -k systemd
    -w /etc/systemd/user/ -p wa -k systemd
    -w /usr/lib/systemd/user/ -p wa -k systemd
    -w /home/ -p wa -k home

    ## Logs e historial (borrado_logs_historial)
    -w /var/log/auth.log -p wa -k logs
    -w /var/log/secure -p wa -k logs
    -w /var/log/syslog -p wa -k logs
    -w /var/log/messages -p wa -k logs
    -w /var/log/wtmp -p wa -k logs
    -w /var/log/btmp -p wa -k logs
    -w /var/log/lastlog -p wa -k logs
    -w /var/log/audit/ -p wa -k logs
    -w /var/log/journal/ -p wa -k logs
